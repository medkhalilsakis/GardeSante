<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="CLASS" height="978px" preserveAspectRatio="none" style="width:819px;height:978px;background:#FFFFFF;" version="1.1" viewBox="0 0 819 978" width="819px" zoomAndPan="magnify"><title>Mod&#232;le de donn&#233;es &#8212; d&#233;coupage en paquets</title><defs/><g><g class="title" data-source-line="26"><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="299.667" x="255.6665" y="25.1074">Mod&#232;le de donn&#233;es &#8212; d&#233;coupage en paquets</text><text fill="#000000" font-family="Segoe UI" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="197.3193" x="306.8403" y="43.7285">44 tables &#183; 121 cl&#233;s &#233;trang&#232;res</text></g><path d="M225,770.2422 L347.2246,770.2422 A3.75,3.75 0 0 1 349.7246,772.7422 L356.7246,824.125 L361.2246,824.125 A2.5,2.5 0 0 1 363.7246,826.625 L363.7246,883.5078 A2.5,2.5 0 0 1 361.2246,886.0078 L225,886.0078 A2.5,2.5 0 0 1 222.5,883.5078 L222.5,772.7422 A2.5,2.5 0 0 1 225,770.2422" fill="#E6F4F1" style="stroke:#0F766E;stroke-width:0.5;"/><line style="stroke:#0F766E;stroke-width:0.5;" x1="222.5" x2="356.7246" y1="824.125" y2="824.125"/><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="121.2246" x="226.5" y="785.1914">Identit&#233;, habilitations</text><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="85.5527" x="244.3359" y="801.1523">et organisation</text><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="59.7246" x="257.25" y="817.1133">(10 tables)</text><text fill="#000000" font-family="Segoe UI" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="37.6816" x="278.2715" y="839.0742">&#171;socle&#187;</text><path d="M273,596.2422 L344.8105,596.2422 A3.75,3.75 0 0 1 347.3105,598.7422 L354.3105,634.1641 L358.8105,634.1641 A2.5,2.5 0 0 1 361.3105,636.6641 L361.3105,677.5859 A2.5,2.5 0 0 1 358.8105,680.0859 L273,680.0859 A2.5,2.5 0 0 1 270.5,677.5859 L270.5,598.7422 A2.5,2.5 0 0 1 273,596.2422" fill="#EEF2FF" style="stroke:#1B4FCA;stroke-width:0.5;"/><line style="stroke:#1B4FCA;stroke-width:0.5;" x1="270.5" x2="354.3105" y1="634.1641" y2="634.1641"/><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="70.8105" x="274.5" y="611.1914">Planification</text><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="59.7246" x="280.043" y="627.1523">(19 tables)</text><path d="M70,435.2422 L227.7383,435.2422 A3.75,3.75 0 0 1 230.2383,437.7422 L237.2383,473.1641 L241.7383,473.1641 A2.5,2.5 0 0 1 244.2383,475.6641 L244.2383,516.5859 A2.5,2.5 0 0 1 241.7383,519.0859 L70,519.0859 A2.5,2.5 0 0 1 67.5,516.5859 L67.5,437.7422 A2.5,2.5 0 0 1 70,435.2422" fill="#EEF2FF" style="stroke:#1B4FCA;stroke-width:0.5;"/><line style="stroke:#1B4FCA;stroke-width:0.5;" x1="67.5" x2="237.2383" y1="473.1641" y2="473.1641"/><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="156.7383" x="71.5" y="450.1914">Absences et remplacements</text><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="52.8223" x="123.458" y="466.1523">(8 tables)</text><path d="M382.5,596.2422 L473.1309,596.2422 A3.75,3.75 0 0 1 475.6309,598.7422 L482.6309,634.1641 L487.1309,634.1641 A2.5,2.5 0 0 1 489.6309,636.6641 L489.6309,677.5859 A2.5,2.5 0 0 1 487.1309,680.0859 L382.5,680.0859 A2.5,2.5 0 0 1 380,677.5859 L380,598.7422 A2.5,2.5 0 0 1 382.5,596.2422" fill="#EEF2FF" style="stroke:#1B4FCA;stroke-width:0.5;"/><line style="stroke:#1B4FCA;stroke-width:0.5;" x1="380" x2="482.6309" y1="634.1641" y2="634.1641"/><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="89.6309" x="384" y="611.1914">Communication</text><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="52.8223" x="402.4043" y="627.1523">(5 tables)</text><path d="M119,293.2422 L179.3145,293.2422 A3.75,3.75 0 0 1 181.8145,295.7422 L188.8145,331.1641 L193.3145,331.1641 A2.5,2.5 0 0 1 195.8145,333.6641 L195.8145,374.5859 A2.5,2.5 0 0 1 193.3145,377.0859 L119,377.0859 A2.5,2.5 0 0 1 116.5,374.5859 L116.5,295.7422 A2.5,2.5 0 0 1 119,293.2422" fill="#EEF2FF" style="stroke:#1B4FCA;stroke-width:0.5;"/><line style="stroke:#1B4FCA;stroke-width:0.5;" x1="116.5" x2="188.8145" y1="331.1641" y2="331.1641"/><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="59.3145" x="120.5" y="308.1914">Tra&#231;abilit&#233;</text><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="52.8223" x="123.7461" y="324.1523">(2 tables)</text><g class="entity" data-entity="N1" data-source-line="52" data-uid="ent0014" id="entity_N1"><path d="M508,577.2422 L508,698.9688 A0,0 0 0 0 508,698.9688 L603.2527,698.9688 L363.6141,815.0268 L611.2527,698.9688 L812.1074,698.9688 A0,0 0 0 0 812.1074,698.9688 L812.1074,587.2422 L802.1074,577.2422 L508,577.2422 A0,0 0 0 0 508,577.2422" fill="#FEF9C3" style="stroke:#B4530A;stroke-width:0.5;"/><path d="M802.1074,577.2422 L802.1074,587.2422 L812.1074,587.2422 L802.1074,577.2422" fill="#FEF9C3" style="stroke:#B4530A;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="200.9355" x="514" y="595.1914">Cloisonnement multi-&#233;tablissement</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="275.127" x="514" y="611.1523">Presque toutes les tables portent `establishment_id`.</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="268.1777" x="514" y="627.1133">Le filtre est appliqu&#233; &#224; chaque requ&#234;te, ce qui isole</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="283.1074" x="514" y="643.0742">les donn&#233;es d'un h&#244;pital de celles des autres. Pour ne</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="254.0918" x="514" y="659.0352">pas surcharger les figures de d&#233;tail, l'association</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="246.457" x="514" y="674.9961">vers &#201;tablissement n'y est pas r&#233;p&#233;t&#233;e : elle est</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="217.084" x="514" y="690.957">pos&#233;e une fois dans la figure &#171; Identit&#233; &#187;.</text></g><g class="entity" data-entity="N2" data-source-line="62" data-uid="ent0015" id="entity_N2"><path d="M6,70.2422 L6,255.8125 A0,0 0 0 0 6,255.8125 L152,255.8125 L156,293.1746 L160,255.8125 L306.041,255.8125 A0,0 0 0 0 306.041,255.8125 L306.041,80.2422 L296.041,70.2422 L6,70.2422 A0,0 0 0 0 6,70.2422" fill="#FEF9C3" style="stroke:#B4530A;stroke-width:0.5;"/><path d="M296.041,70.2422 L296.041,80.2422 L306.041,80.2422 L296.041,70.2422" fill="#FEF9C3" style="stroke:#B4530A;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="155.5664" x="12" y="88.1914">Tra&#231;abilit&#233; en &#233;criture seule</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="266.291" x="12" y="104.1523">`activity_logs` (386 lignes observ&#233;es) n'est expos&#233;e</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="279.041" x="12" y="120.1133">par aucune route de modification ni de suppression :</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="256.3477" x="12" y="136.0742">aucun acteur, directeur compris, ne peut r&#233;&#233;crire</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="248.0859" x="12" y="152.0352">l'historique. Le paquet r&#233;f&#233;rence les entit&#233;s des</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="211.7871" x="12" y="167.9961">autres paquets par couple (`entity_type`,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="252.0469" x="12" y="183.957">`entity_id`), sans cl&#233; &#233;trang&#232;re, afin de survivre &#224;</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="162.5684" x="12" y="199.918">la suppression de l'entit&#233; cit&#233;e.</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="278.9238" x="12" y="215.8789">`audit_logs` est d&#233;clar&#233;e au sch&#233;ma mais aucun code</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="247.9688" x="12" y="231.8398">ne l'alimente : la tra&#231;abilit&#233; repose enti&#232;rement</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="92.6016" x="12" y="247.8008">sur `activity_logs`.</text></g><g class="entity" data-entity="N3" data-source-line="76" data-uid="ent0016" id="entity_N3"><path d="M263,432.2422 L263,522.0469 A0,0 0 0 0 263,522.0469 L379.0943,522.0469 L340.0131,596.1875 L387.0943,522.0469 L554.7969,522.0469 A0,0 0 0 0 554.7969,522.0469 L554.7969,442.2422 L544.7969,432.2422 L263,432.2422 A0,0 0 0 0 263,432.2422" fill="#FEF9C3" style="stroke:#B4530A;stroke-width:0.5;"/><path d="M544.7969,432.2422 L544.7969,442.2422 L554.7969,442.2422 L544.7969,432.2422" fill="#FEF9C3" style="stroke:#B4530A;stroke-width:0.5;"/><text fill="#000000" font-family="Segoe UI" font-size="12" font-weight="bold" lengthAdjust="spacing" textLength="125.373" x="269" y="450.1914">Sens des d&#233;pendances</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="268.4355" x="269" y="466.1523">Aucun paquet n'est r&#233;f&#233;renc&#233; par le socle Identit&#233; :</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="270.7969" x="269" y="482.1133">la d&#233;pendance va toujours du m&#233;tier vers l'identit&#233;,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="254.127" x="269" y="498.0742">jamais l'inverse. Le graphe des paquets est donc</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="51.5449" x="269" y="514.0352">acyclique.</text></g><g class="link" data-entity-1="P_PLAN" data-entity-2="P_ID" data-uid="lnk7" id="link_P_PLAN_P_ID"><polygon fill="#334155" points="290.6465,770.2164,294.6811,761.2319,290.6658,765.2164,286.6812,761.2011,290.6465,770.2164" style="stroke:#334155;stroke-width:1;"/><path d="M302.1605,680.4967 C298.8281,692.2345 295.7324,705.1245 294,717.2422 C291.554,734.3519 290.7355,747.1117 290.6696,764.2165" fill="none" style="stroke:#334155;stroke-width:1;stroke-dasharray:7,7;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="71.9707" x="317.5859" y="732.1914">agent affect&#233;,</text><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="115.1426" x="296" y="748.1523">service, &#233;tablissement</text></g><g class="link" data-entity-1="P_ABS" data-entity-2="P_ID" data-uid="lnk8" id="link_P_ABS_P_ID"><polygon fill="#334155" points="222.3882,774.6429,218.4959,765.5958,218.7171,771.2483,213.0645,771.4696,222.3882,774.6429" style="stroke:#334155;stroke-widt