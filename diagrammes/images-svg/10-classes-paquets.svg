RACE" data-entity-2="P_ID" data-uid="lnk11" id="link_P_TRACE_P_ID"><polygon fill="#334155" points="222.3305,790.6165,216.8137,782.4578,218.089,787.9691,212.5777,789.2443,222.3305,790.6165" style="stroke:#334155;stroke-width:1;"/><path d="M116.0163,364.4946 C95.0846,381.5845 71.139,405.2619 58,432.2422 C33.1769,483.2151 29.8318,504.9006 46,559.2422 C75.213,657.4279 98.7183,680.6627 172,752.2422 C186.7631,766.6623 199.6786,776.4777 217.2407,787.4396" fill="none" style="stroke:#334155;stroke-width:1;stroke-dasharray:7,7;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="92.2266" x="48" y="555.1914">auteur de l'action</text></g><g class="link" data-entity-1="P_TRACE" data-entity-2="P_PLAN" data-uid="lnk12" id="link_P_TRACE_P_PLAN"><polygon fill="#334155" points="347.8874,596.17,357.0578,592.5777,351.401,592.6127,351.3661,586.9559,347.8874,596.17" style="stroke:#334155;stroke-width:1;"/><path d="M195.6702,339.469 C289.0276,347.9687 518.1995,374.4143 564,432.2422 C588.8348,463.5987 588.0987,490.3165 564,522.2422 C510.2641,593.4308 446.888,530.3767 371,577.2422 C362.7041,582.3654 359.101,584.8169 352.1038,591.9012" fill="none" style="stroke:#334155;stroke-width:1;stroke-dasharray:7,7;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="90.9199" x="585" y="482.6914">entit&#233; journalis&#233;e</text></g><g class="link" data-entity-1="P_TRACE" data-entity-2="P_ABS" data-uid="lnk13" id="link_P_TRACE_P_ABS"><polygon fill="#334155" points="156,434.8058,160,425.8058,156,429.8058,152,425.8058,156,434.8058" style="stroke:#334155;stroke-width:1;"/><path d="M156,377.4896 C156,395.5568 156,410.7171 156,428.8058" fill="none" style="stroke:#334155;stroke-width:1;stroke-dasharray:7,7;"/><text fill="#000000" font-family="Segoe UI" font-size="12" lengthAdjust="spacing" textLength="90.9199" x="158" y="410.1914">entit&#233; journalis&#233;e</text></g><g class="legend" data-source-line="87"><rect fill="none" height="65.8633" rx="7.5" ry="7.5" style="stroke:#000000;stroke-width:1;" width="332.3691" x="466.6309" y="892.2422"/><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="322.3691" x="471.6309" y="912.3496">Vert : socle commun, r&#233;f&#233;renc&#233; par tous les paquets.</text><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="133.4648" x="471.6309" y="930.9707">Bleu : paquets m&#233;tier.</text><text fill="#000000" font-family="Segoe UI" font-size="14" lengthAdjust="spacing" textLength="298.8945" x="471.6309" y="949.5918">Fl&#232;che pointill&#233;e : d&#233;pendance par cl&#233; &#233;trang&#232;re.</text></g><!--SRC=[TLLDRzj64BtpLqpJWp-W2fPbkuaH191L2p2Gg4QTzXJ0NfChQfFbBhsxTAe61NhjlJyWjrhjjK0FlON_fB-aRvQqJTEfuG-PExFptfitmozA9_92a1OhMmNoXGp2YCI_KwOKJXHqAT9tkRELoQPMMqTVpk9N9oAJ2r7fCBCcp4KXwKpcLjBt9vyFELC_IHhjTWxzKcJslJ8vBOJsidCoSSw-RykEntkZ_VtEuIc0YLmUMPT9rmQDZlPcqybdWleaZezdkmz8j84HOLXfIPTMPvtpiZcd3mbHxxRdpxrDjNpn0jSUpFPc8mwvHzKvtfbzVN1mdFpSkNTkmsDqi-FPi-cu7zKbUhItFzwP94bG0LXVsQo-mTyCtzQOUYqz_VlBRvJLwzHM9UEM1XIkAXdy6xEtHq5SQWHz-Xkj656gwxMdUXsSC7bzuwHFabl2JquoQL2cNWzeAIwLLa44PGtkaO6iouLHFZvvOpP7E-tDMqz8U3ezF_c6xlb_0FFxUqyrCXSglSjzriizVJcPzt8cbrwQ5C1HsicYr2AL1U01pERJNlhawAoNFRL5KPdxYlkzZEcthtePhvseVsz8rsjaxFOoNdytcHutEItUuV15G_kGS8C991OBcR9wRuoNxbgbSi1AunhbVGIVD5WVPpBPWBpctuOluFGoOjb3oWNimReWo1YUfclbqTQauTMzlGgoSWEunGTbH13AILGfhGDCcTooUfJ1zj8R8cNrUb4jXjOezDPMpWZDzVltCUx_2KmCNCwwpdc2jhUdsYeFEqUHgC3-K5yzL6vx6u6di2kCJG7x2yvWMxVkPaQSUW6YCMl9IUSgknWYxwMaXTB1GJGFiSjIgwiAcEgFb2vvLA0u7lmHqB1KqbMb272qH2fVVZTesKPbQ5d_LM8mD6kKIXq3y0FXW6v8f-19XbDByFELGmMNInTlMgYySZ611nRjq0FMsMDiLBGgqgwbmu3-sYLFPcCLeVELhbwNo0KWLXVr-OJBMPQMAWEoK9CoOI2HQ6lIfp_fRhpfqp_3H9gCk0sTPkp6PZoO1DucM2rE1Rx4oqhBs8eBDiUr2gjpRND_GPlZfmUaLMx0pbwo_LcnBI1dtFB71brKnK6hb64wRYDhKTZiRZsGKVp8LsK9fJm_EKHQJ24KRVmC7yUFbDgYTCeF83cL4gyro1FnkjYzZQNomJgqMmxP1irYvA15lNQyO69VMbrY9sCnxkNj5esGURb2wisB6Bew3wjINWnOYFO1hBOr8C-YyuxjhjW1DeCo3I